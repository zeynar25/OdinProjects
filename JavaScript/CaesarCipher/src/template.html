<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caesar Cipher</title>
  </head>
  <body>
    <h1>Caesar Cipher</h1>
    <form action="" id="cipher-key">
      <label for="shift">Shift</label>
      <input type="number" name="shift" id="shift" value="0" />
    </form>

    <form action="" id="encrypt-form">
      <label for="plain-text">Plain text</label>
      <input type="text" name="plain-text" id="plain-text" />
      <button type="submit">Encrypt</button>
    </form>

    <form action="" id="decrypt-form">
      <label for="cipher-text">Cipher text</label>
      <input type="text" name="cipher-text" id="cipher-text" />
      <button type="submit">Decrypt</button>
    </form>
  </body>
</html>
