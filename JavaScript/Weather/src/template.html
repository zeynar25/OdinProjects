<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="main-container">
      <div id="header">
        <h1>Weather App</h1>
      </div>
      <div id="weather-data">
        <form action="">
          <label for="temperature-unit">Temperature Unit:</label>
          <select name="temperature-unit" id="temperature-unit">
            <option value="celsius">Celcius</option>
            <option value="fahrenheit">Farenheit</option>
          </select>
        </form>
        <div id="hourly-weather"></div>
      </div>
    </div>
  </body>
</html>
