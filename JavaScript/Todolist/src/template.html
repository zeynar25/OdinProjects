<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todolist</title>
  </head>
  <body>
    <div id="projects">
      <h1 class="project-title">Projects</h1>
      <nav id="project-nav"></nav>
      <button id="add-project-btn">+ Add Project</button>
      <div
        id="project-form-container"
        class="form-container floating-centered-modal"
      >
        <button id="close-project-form-btn" class="form-btn close-form-btn">
          x
        </button>
        <h2 id="project-form-title">Add Project</h2>
        <form id="project-form">
          <input
            id="project-input-name"
            type="text"
            name="project-name"
            placeholder="Project Name"
            required
          />
          <button type="submit">Add Project</button>
        </form>
      </div>
    </div>
    <div id="project-todo-list">
      <button id="todo-list-date-btn"></button>
      <div id="todo-list-date" class="form-container floating-centered-modal">
        <button id="close-todo-list-date-btn" class="form-btn close-form-btn">
          x
        </button>
        <div id="todo-list-years">2026</div>
        <div id="todo-list-months">
          <button class="todo-list-month">January</button>
          <button class="todo-list-month">February</button>
          <button class="todo-list-month">March</button>
          <button class="todo-list-month">April</button>
          <button class="todo-list-month">May</button>
          <button class="todo-list-month">June</button>
          <button class="todo-list-month">July</button>
          <button class="todo-list-month">August</button>
          <button class="todo-list-month">September</button>
          <button class="todo-list-month">October</button>
          <button class="todo-list-month">November</button>
          <button class="todo-list-month">December</button>
        </div>
      </div>
      <div id="todo-list"></div>
      <button id="add-todo-btn">+ Add Todo</button>
      <div id="todo-form-container" class="form-container">
        <form id="todo-form">
          <input
            id="todo-input-name"
            type="text"
            name="todo-name"
            placeholder="Task Name"
            required
          />
          <input
            id="todo-input-description"
            type="text"
            name="todo-description"
            placeholder="Description"
          />
          <div id="todo-form-additives">
            <input
              id="todo-input-due-date"
              type="date"
              name="todo-due-date"
              placeholder="Todo Due Date"
              required
            />
            <select id="todo-input-priority" name="todo-priority" required>
              <option value="1">High</option>
              <option value="2">Medium</option>
              <option value="3" selected>Low</option>
            </select>
            <div id="todo-btns">
              <button
                id="close-todo-form-btn"
                class="form-btn close-form-btn"
                title="cancel"
              >
                x
              </button>
              <button
                type="submit"
                title="add todo"
                class="form-btn add-todo-btn"
              >
                +
              </button>
            </div>
          </div>
        </form>
      </div>
      <div
        id="todo-edit-form-container"
        class="form-container floating-centered-modal"
      >
        <button id="close-todo-edit-form-btn" class="form-btn close-form-btn">
          x
        </button>
        <h2 id="todo-form-title">Edit Todo</h2>
        <form id="todo-edit-form">
          <input
            id="todo-edit-input-name"
            type="text"
            name="todo-name"
            placeholder="Task Name"
            required
          />
          <input
            id="todo-edit-input-description"
            type="text"
            name="todo-description"
            placeholder="Description"
          />
          <div id="todo-form-additives">
            <input
              id="todo-edit-input-due-date"
              type="date"
              name="todo-due-date"
              placeholder="Todo Due Date"
              required
            />
            <select id="todo-edit-input-priority" name="todo-priority" required>
              <option value="1">High</option>
              <option value="2">Medium</option>
              <option value="3" selected>Low</option>
            </select>
          </div>
          <button id="submit-edit-form-btn" type="submit" disabled>
            Save Changes
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
